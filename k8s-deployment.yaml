apiVersion: apps/v1
kind: Deployment
metadata:
  name: difinest-deployment
  labels:
    app: difinest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: difinest
  template:
    metadata:
      labels:
        app: difinest
    spec:
      containers:
      - name: difinest
        image: sajitss/difinest:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        volumeMounts:
        - name: difinest-data
          mountPath: /app/data
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: difinest-data
        persistentVolumeClaim:
          claimName: difinest-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: difinest-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: difinest-service
  labels:
    app: difinest
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: difinest
